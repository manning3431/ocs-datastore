services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pmo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 👇 Forces Postgres 18 to look directly into the root data directory
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 👇 Maps your volume directly to match the legacy path structure
      - pmo_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - pmo_network

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pmo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    volumes:
      - pmo_pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pmo_network

volumes:
  pmo_pgdata:
    name: pmo_pgdata
  pmo_pgadmin_data:
    name: pmo_pgadmin_data

networks:
  pmo_network:
    external: true
    name: pmo_network
